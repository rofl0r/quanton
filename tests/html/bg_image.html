<html>
<body>
<h2>Background Image Test</h2>

<!-- Box with background-image repeat (default: repeat) -->
<div style="width:200px; height:100px; background-color:#ccddee;
            background-image:url('./tests/img/tile.png');
            margin-bottom:8px;">
  repeat (default)
</div>

<!-- Box with background-image no-repeat, centered -->
<div style="width:200px; height:100px; background-color:#eeddcc;
            background-image:url('./tests/img/tile.png');
            background-repeat:no-repeat;
            background-position:center center;
            margin-bottom:8px;">
  no-repeat center
</div>

<!-- Box with background-image repeat-x -->
<div style="width:200px; height:100px; background-color:#ddeedd;
            background-image:url('./tests/img/tile.png');
            background-repeat:repeat-x;
            margin-bottom:8px;">
  repeat-x
</div>

<!-- Box with background-image repeat-y -->
<div style="width:200px; height:100px; background-color:#ddddee;
            background-image:url('./tests/img/tile.png');
            background-repeat:repeat-y;">
  repeat-y
</div>
</body>
</html>
