<html>
<body>
<h2>Percent-Width Table Test</h2>

<!-- Table using percent-width columns: 10% / 80% / 10% -->
<table style="width:100%; border-collapse:collapse;">
  <thead>
    <tr>
      <th width="10%" style="background-color:#d8e2f2; border-width:1px; border-color:#303030;">#</th>
      <th width="80%" style="background-color:#d8e2f2; border-width:1px; border-color:#303030;">Description</th>
      <th width="10%" style="background-color:#d8e2f2; border-width:1px; border-color:#303030;">Size</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td style="border-width:1px; border-color:#303030;">1</td>
      <td style="border-width:1px; border-color:#303030;">This column should be wide (80% of table width)</td>
      <td style="border-width:1px; border-color:#303030;">4096</td>
    </tr>
    <tr>
      <td style="border-width:1px; border-color:#303030;">2</td>
      <td style="border-width:1px; border-color:#303030;">Another long entry to verify proportional layout</td>
      <td style="border-width:1px; border-color:#303030;">1024</td>
    </tr>
    <tr>
      <td style="border-width:1px; border-color:#303030;">3</td>
      <td style="border-width:1px; border-color:#303030;">Short</td>
      <td style="border-width:1px; border-color:#303030;">0</td>
    </tr>
  </tbody>
</table>
</body>
</html>
